[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxis-credit-protocol"
version = "1.0.0"
description = "Vyper credit-line protocol with Python integration tests"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pytest>=8.0,<10.0",
  "titanoboa==0.2.8",
  "vyper==0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = []
